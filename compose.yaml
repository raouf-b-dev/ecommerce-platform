# ecommerce-platform: run the full ecommerce stack with one command.
#
#   cp .env.example .env
#   docker compose up -d --wait
#
# Compose Specification file (no `version:` key). Application versions are
# pinned in .env (ECOM_*_VERSION). Infrastructure images are pinned here so
# Dependabot can update them.
#
# Startup order (each step waits for the previous one):
#   postgres, redis, jwt-keygen -> migrate -> seed -> api
#   -> admin, web

name: ecommerce-platform

x-api-env: &api-env
  # API runtime mode. See .env.example for why the demo uses staging.
  NODE_ENV: ${API_NODE_ENV:?set API_NODE_ENV in .env}
  PORT: '3000'
  DB_HOST: postgres
  DB_PORT: '5432'
  DB_USERNAME: ${POSTGRES_USER:?set POSTGRES_USER in .env}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  DB_DATABASE: ${POSTGRES_DB:?set POSTGRES_DB in .env}
  DB_SSL: 'false'
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
  REDIS_KEYPREFIX: 'ecom:platform:'
  REDIS_TLS: 'false'
  # Browsers reach the API through the published host port.
  PUBLIC_BASE_URL: http://localhost:${API_PORT:?set API_PORT in .env}
  CORS_ALLOWED_ORIGINS: http://localhost:${API_PORT},http://localhost:${ADMIN_PORT:?set ADMIN_PORT in .env},http://localhost:${WEB_PORT:?set WEB_PORT in .env}
  STORE_DEFAULT_CURRENCY: ${STORE_DEFAULT_CURRENCY:?set STORE_DEFAULT_CURRENCY in .env}
  PAYMENT_MOCK_AUTO_COMPLETE: ${PAYMENT_MOCK_AUTO_COMPLETE:?set PAYMENT_MOCK_AUTO_COMPLETE in .env}
  METRICS_API_KEY: ${METRICS_API_KEY:?set METRICS_API_KEY in .env}
  SWAGGER_ENABLED: 'true'
  OTEL_TRACING_ENABLED: 'false'
  LOG_LEVEL: ${API_LOG_LEVEL:?set API_LOG_LEVEL in .env}
  LOG_TRANSPORT: console
  IS_DB_SYNCHRONIZE: 'false'
  # Harmless leftovers some older images checked at boot; safe on 0.11.x.
  POSTGRES_CONTAINER_NAME: postgres
  POSTGRES_IMAGE: postgres:18.6

# Entrypoint for seed and api: reads the demo signing key generated by
# jwt-keygen into JWT_PRIVATE_KEY, then runs the service command. The API
# only accepts the key as an env var.
x-with-jwt-key: &with-jwt-key
  - /bin/sh
  - -c
  - 'JWT_PRIVATE_KEY="$$(cat /run/jwt/private.pem)" && export JWT_PRIVATE_KEY && exec "$$@"'
  - with-jwt-key

x-restart: &restart-policy
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  postgres:
    image: postgres:18.6
    <<: [*restart-policy, *logging]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    # The API uses RedisJSON and RediSearch, so plain redis images do not work.
    image: redis/redis-stack-server:7.2.0-v18
    <<: [*restart-policy, *logging]
    environment:
      REDIS_ARGS: --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env} --appendonly yes
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  jwt-keygen:
    # One-shot: creates a demo RS256 signing key on first start. The key lives
    # only in the jwt_keys volume; `reset` deletes it with the data.
    image: ghcr.io/raouf-b-dev/ecommerce-store-api:${ECOM_API_VERSION:?set ECOM_API_VERSION in .env}
    <<: *logging
    user: '0:0'
    entrypoint: ['node', '-e']
    command:
      - |
        const fs = require('fs');
        const path = '/run/jwt/private.pem';
        if (fs.existsSync(path)) { console.log('JWT signing key already exists'); process.exit(0); }
        const { privateKey } = require('crypto').generateKeyPairSync('rsa', {
          modulusLength: 2048,
          publicKeyEncoding: { type: 'spki', format: 'pem' },
          privateKeyEncoding: { type: 'pkcs8', format: 'pem' },
        });
        fs.writeFileSync(path, privateKey, { mode: 0o640 });
        fs.chownSync(path, 100, 101); // appuser:appgroup in the API image
        console.log('Generated a new demo JWT signing key');
    volumes:
      - jwt_keys:/run/jwt
    restart: 'no'

  migrate:
    # One-shot: applies pending TypeORM migrations with the script shipped in
    # the API image, then exits.
    image: ghcr.io/raouf-b-dev/ecommerce-store-api:${ECOM_API_VERSION:?set ECOM_API_VERSION in .env}
    <<: *logging
    entrypoint: ['node', 'scripts/docker-migrate.js']
    environment:
      <<: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  seed:
    # One-shot: loads the demo catalog, users, carts and orders. Idempotent, so
    # it is safe on every `up`.
    # pull_policy: missing = if this image:tag is absent from the *local* Docker
    # engine, Compose builds `target: seed` from the git context below. It does
    # not mean "missing on GHCR". Prefer GHCR with `docker compose pull seed`
    # (or `make update`) before `up`. For a local API clone, override
    # build.context in compose.override.yaml.
    image: ghcr.io/raouf-b-dev/ecommerce-store-api-seed:${ECOM_API_VERSION:?set ECOM_API_VERSION in .env}
    build:
      context: https://github.com/raouf-b-dev/ecommerce-store-api.git#v${ECOM_API_VERSION}
      target: seed
    pull_policy: missing
    <<: *logging
    entrypoint: *with-jwt-key
    command: ['node_modules/.bin/ts-node', '-r', 'tsconfig-paths/register', 'scripts/seed.ts']
    environment:
      <<: *api-env
    volumes:
      - jwt_keys:/run/jwt:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      jwt-keygen:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: 'no'

  api:
    image: ghcr.io/raouf-b-dev/ecommerce-store-api:${ECOM_API_VERSION:?set ECOM_API_VERSION in .env}
    <<: [*restart-policy, *logging]
    # Migrations are owned by the migrate service, so this skips the image
    # entrypoint and starts Node directly. init: true keeps a PID 1 that
    # forwards signals, as the image's tini entrypoint would.
    init: true
    entrypoint: *with-jwt-key
    command: ['node', 'dist/main.js']
    environment:
      <<: *api-env
    volumes:
      - jwt_keys:/run/jwt:ro
    # Loopback only: local browsers use localhost; hosted Tunnel targets 127.0.0.1.
    # Avoids publishing the API on 0.0.0.0 (see docs/HOSTED-DEMO.md / SECURITY.md).
    ports:
      - '127.0.0.1:${API_PORT:?set API_PORT in .env}:3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health/readiness']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  admin:
    image: ghcr.io/raouf-b-dev/ecommerce-admin-dashboard:${ECOM_ADMIN_VERSION:?set ECOM_ADMIN_VERSION in .env}
    # Published image listens on 8080 and renders /config.js from API_BASE_URL.
    <<: [*restart-policy, *logging]
    environment:
      API_BASE_URL: http://localhost:${API_PORT:?set API_PORT in .env}
    ports:
      - '${ADMIN_PORT:?set ADMIN_PORT in .env}:8080'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8080/']
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      api:
        condition: service_healthy

  web:
    image: ghcr.io/raouf-b-dev/ecommerce-store-web:${ECOM_WEB_VERSION:?set ECOM_WEB_VERSION in .env}
    # Browser uses API_BASE_URL (localhost host port). SSR uses the compose
    # DNS name via API_INTERNAL_BASE_URL.
    <<: [*restart-policy, *logging]
    environment:
      API_BASE_URL: http://localhost:${API_PORT:?set API_PORT in .env}
      API_INTERNAL_BASE_URL: http://api:3000
    ports:
      - '${WEB_PORT:?set WEB_PORT in .env}:3100'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3100/icon.svg']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # Observability profile: docker compose --profile observability up -d --wait
  # Prometheus scrapes the API /metrics endpoint; Grafana shows the API's own
  # dashboards, downloaded from the API repository at the pinned tag.
  # -------------------------------------------------------------------------

  grafana-dashboards:
    profiles: ['observability']
    image: ghcr.io/raouf-b-dev/ecommerce-store-api:${ECOM_API_VERSION:?set ECOM_API_VERSION in .env}
    <<: *logging
    user: '0:0'
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -eu
        base="https://raw.githubusercontent.com/raouf-b-dev/ecommerce-store-api/v${ECOM_API_VERSION}/docker/monitoring/grafana/provisioning/dashboards/json"
        for name in api-overview business-metrics checkout-saga infrastructure; do
          wget -q -O "/dashboards/$${name}.json" "$${base}/$${name}.json"
        done
        echo "Downloaded API dashboards for v${ECOM_API_VERSION}"
    volumes:
      - grafana_dashboards:/dashboards
    restart: 'no'

  prometheus:
    profiles: ['observability']
    image: prom/prometheus:v3.15.0
    <<: [*restart-policy, *logging]
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    secrets:
      - metrics_api_key
    volumes:
      - prometheus_data:/prometheus
    ports:
      - '${PROMETHEUS_PORT:?set PROMETHEUS_PORT in .env}:9090'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:9090/-/healthy']
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      api:
        condition: service_healthy

  grafana:
    profiles: ['observability']
    image: grafana/grafana:13.2.4
    <<: [*restart-policy, *logging]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    configs:
      - source: grafana_datasources
        target: /etc/grafana/provisioning/datasources/datasources.yml
      - source: grafana_dashboard_provider
        target: /etc/grafana/provisioning/dashboards/dashboards.yml
    volumes:
      - grafana_data:/var/lib/grafana
      - grafana_dashboards:/var/lib/grafana-dashboards:ro
    ports:
      - '${GRAFANA_PORT:?set GRAFANA_PORT in .env}:3000'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      prometheus:
        condition: service_healthy
      grafana-dashboards:
        condition: service_completed_successfully

configs:
  prometheus_config:
    file: ./config/observability/prometheus.yml
  grafana_datasources:
    file: ./config/observability/grafana-datasources.yml
  grafana_dashboard_provider:
    file: ./config/observability/grafana-dashboard-provider.yml

secrets:
  metrics_api_key:
    environment: METRICS_API_KEY

volumes:
  postgres_data:
  redis_data:
  jwt_keys:
  prometheus_data:
  grafana_data:
  grafana_dashboards:
