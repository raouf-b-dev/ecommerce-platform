# API-tier overlay for the hybrid hosted demo.
# UIs run on Cloudflare Pages and Vercel; this VM runs data + API only.
#
#   docker compose -f compose.yaml -f overrides/compose.hosted-api.yaml up -d --wait
#
# Requires hosted keys in .env (see .env.example and docs/HOSTED-DEMO.md):
#   PUBLIC_BASE_URL, CORS_ALLOWED_ORIGINS, AUTH_COOKIE_SAMESITE,
#   DEMO_RESET_ENABLED, DEMO_RESET_TOKEN
#
# Postgres/Redis stay compose-internal. API binds loopback for Cloudflare Tunnel.
# Observability profile stays opt-in (off unless you pass --profile observability).

x-hosted-api-env: &hosted-api-env
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env for hosted}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS in .env for hosted}
  AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:?set AUTH_COOKIE_SAMESITE in .env for hosted}
  DEMO_RESET_ENABLED: ${DEMO_RESET_ENABLED:?set DEMO_RESET_ENABLED in .env for hosted}
  DEMO_RESET_TOKEN: ${DEMO_RESET_TOKEN:-}

services:
  # Profile-gated so `up` without that profile omits the UI containers.
  admin:
    profiles: ['local-ui']
  web:
    profiles: ['local-ui']

  postgres:
    ports: !override []

  redis:
    ports: !override []

  migrate:
    environment:
      <<: *hosted-api-env

  seed:
    environment:
      <<: *hosted-api-env

  api:
    environment:
      <<: *hosted-api-env
    ports: !override
      - '127.0.0.1:${API_PORT:?set API_PORT in .env}:3000'
