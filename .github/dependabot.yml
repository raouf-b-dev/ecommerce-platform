version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'master'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'github-actions'
  # Infrastructure images pinned in compose.yaml (postgres, redis-stack,
  # socat, prometheus, grafana). Application versions live in .env.example
  # and are bumped by hand (see README "Upgrading").
  - package-ecosystem: 'docker-compose'
    directory: '/'
    target-branch: 'master'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'docker'
