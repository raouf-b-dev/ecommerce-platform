name: CI

on:
  pull_request:
    branches: [master, main, develop]
  push:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests that touch compose.yaml, config/observability/, this
  # workflow or .github/actions/setup-platform/ (including Dependabot bumps
  # of postgres, prometheus or grafana) also run the observability smoke;
  # other pull requests skip it.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      observability: ${{ steps.filter.outputs.observability }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Filter changed paths
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # The diff runs on its own line so a git error fails this job (and so
        # CI Status Check) instead of silently skipping the smoke.
        run: |
          changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          if printf '%s\n' "$changed" | grep -Eq '^(compose\.yaml|config/observability/|\.github/workflows/ci\.yml|\.github/actions/setup-platform/)'; then
            echo "observability=true" >> "$GITHUB_OUTPUT"
          else
            echo "observability=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup platform
        uses: ./.github/actions/setup-platform

      - name: Install yamllint
        run: pip install --user yamllint==1.37.1

      - name: Install actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash)
          sudo mv actionlint /usr/local/bin/actionlint

      - name: ASCII prose lint
        run: npm run lint:ascii

      - name: Yamllint
        run: yamllint -c .yamllint.yaml compose.yaml .github config overrides

      - name: Actionlint
        run: actionlint

  pins:
    name: Pin Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup platform
        uses: ./.github/actions/setup-platform

      - name: Pin sync
        run: npm run check:pins

  compose:
    name: Compose Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup platform
        uses: ./.github/actions/setup-platform

      - name: Compose guardrails
        run: npm run check:compose

      - name: Resolved compose guardrails
        run: npm run check:resolved

      - name: Compose config
        run: docker compose config --quiet

      - name: Compose config (observability profile)
        run: docker compose --profile observability config --quiet

      - name: Compose config (hosted API overlay)
        run: docker compose -f compose.yaml -f overrides/compose.hosted-api.yaml config --quiet

  script-tests:
    name: Script Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup platform
        uses: ./.github/actions/setup-platform

      - name: Script unit tests
        run: npm run test:scripts

  # Same idea as ecommerce-store-api: surface vulnerable dependency changes on PRs
  # before merge. Complements Dependabot; skipped on push/dispatch.
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup platform
        uses: ./.github/actions/setup-platform

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start stack
        run: docker compose up -d --wait

      - name: Smoke probes
        run: npm run smoke

      - name: Tear down
        if: always()
        run: docker compose --profile '*' down -v --remove-orphans

  ci:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [changes, lint, pins, compose, script-tests, dependency-review, smoke, observability-smoke]
    if: always()
    steps:
      - name: Check all jobs status
        env:
          EVENT_NAME: ${{ github.event_name }}
          LINT_STATUS: ${{ needs.lint.result }}
          PINS_STATUS: ${{ needs.pins.result }}
          COMPOSE_STATUS: ${{ needs.compose.result }}
          SCRIPT_TESTS_STATUS: ${{ needs.script-tests.result }}
          CHANGES_STATUS: ${{ needs.changes.result }}
          OBSERVABILITY_CHANGED: ${{ needs.changes.outputs.observability }}
          DEPENDENCY_REVIEW_STATUS: ${{ needs.dependency-review.result }}
          SMOKE_STATUS: ${{ needs.smoke.result }}
          OBSERVABILITY_SMOKE_STATUS: ${{ needs.observability-smoke.result }}
        run: |
          echo "event: $EVENT_NAME"
          failed=false
          check() {
            local name="$1" status="$2" require_success="$3"
            echo "$name: $status"
            if [ "$status" = "failure" ] || [ "$status" = "cancelled" ]; then
              echo "::error::$name $status"
              failed=true
            elif [ "$require_success" = true ] && [ "$status" != "success" ]; then
              echo "::error::$name was $status but must succeed on this run"
              failed=true
            fi
          }
          # dependency-review only runs on pull_request; skipped elsewhere is OK.
          # changes runs on every pull_request; skipped elsewhere is OK.
          dep_required=false
          if [ "$EVENT_NAME" = "pull_request" ]; then
            dep_required=true
          fi
          # observability-smoke runs on workflow_dispatch and on pull requests
          # that touch compose.yaml or config/observability/; skipped otherwise.
          obs_required=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$OBSERVABILITY_CHANGED" = "true" ]; then
            obs_required=true
          fi
          check changes "$CHANGES_STATUS" "$dep_required"
          check lint "$LINT_STATUS" true
          check pins "$PINS_STATUS" true
          check compose "$COMPOSE_STATUS" true
          check script-tests "$SCRIPT_TESTS_STATUS" true
          check dependency-review "$DEPENDENCY_REVIEW_STATUS" "$dep_required"
          check smoke "$SMOKE_STATUS" true
          check observability-smoke "$OBSERVABILITY_SMOKE_STATUS" "$obs_required"
          if [ "$failed" = true ]; then
            echo "One or more required jobs did not pass."
            exit 1
          fi
          echo "All checks passed successfully!"

  observability-smoke:
    name: Observability Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes]
    # always() so the skipped changes job (push, dispatch) does not skip this one.
    if: >-
      ${{ always() && (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.observability == 'true') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup platform
        uses: ./.github/actions/setup-platform

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start stack with observability
        run: docker compose --profile observability up -d --wait

      - name: Probe Grafana and Prometheus
        run: |
          curl -fsS -o /dev/null http://127.0.0.1:3001/api/health
          curl -fsS -o /dev/null http://127.0.0.1:9090/-/healthy

      - name: Tear down
        if: always()
        run: docker compose --profile '*' down -v --remove-orphans
